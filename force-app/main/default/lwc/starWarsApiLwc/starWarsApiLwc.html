<!-- Star Wars API LWC -->
<template>
	<lightning-card title="Star Wars API">
		<lightning-tabset>
			<lightning-tab label="Films">
				<lightning-datatable
					key-field="id"
					data={filmsTableData}
					columns={filmsColumns}
					title="Films"
				></lightning-datatable>
			</lightning-tab>
			<lightning-tab label="People">
				<lightning-datatable
					key-field="url"
					data={peopleTableData}
					columns={peopleColumns}
					title="People"
				></lightning-datatable>
			</lightning-tab>
			<lightning-tab label="Planets">
				<p>{planetsJSON}</p>
			</lightning-tab>
			<lightning-tab label="Species">
				<p>{speciesJSON}</p>
			</lightning-tab>
			<lightning-tab label="Vehicles">
				<p>{vehiclesJSON}</p>
			</lightning-tab>
			<lightning-tab label="Starships">
				<p>{starshipsJSON}</p>
			</lightning-tab>
		</lightning-tabset>
	</lightning-card>
</template>
