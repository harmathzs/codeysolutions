<!-- Train Track HU -->
<template>
	<lightning-card title="Train Track HU">
		<lightning-spinner if:true={isLoading}></lightning-spinner>

		<lightning-accordion>
			<lightning-accordion-section label="Status">
				<lightning-formatted-rich-text value={status}></lightning-formatted-rich-text>
			</lightning-accordion-section>
			<lightning-accordion-section label="Stats">
				<lightning-formatted-rich-text value={stats}></lightning-formatted-rich-text>
			</lightning-accordion-section>
			<lightning-accordion-section label="Trains">
				<div class="iframe-outer-div">
					<iframe src="/apex/TrainTrackTrainsFramed"></iframe>
				</div>
			</lightning-accordion-section>
		</lightning-accordion>
	</lightning-card>
</template>
